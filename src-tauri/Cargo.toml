[package]
name = "netscope"
version = "1.1.0"
description = "NetScope Desktop Network Topology & Threat Visualizer"
authors = ["NetScope Team"]
edition = "2021"

[lib]
name = "netscope_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["javascript", "typescript"] }
specta-typescript = "=0.0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
netstat2 = "0.11.2"
default-net = "0.22.0"
ferrisetw = "1.2.0"
