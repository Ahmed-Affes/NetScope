<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090d" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Network rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#ringGrad1)" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Outer nodes and connecting lines -->
  <line x1="256" y1="256" x2="140" y2="160" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="380" y2="170" stroke="#e879f9" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="360" y2="350" stroke="#34d399" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="150" y2="360" stroke="#fb923c" stroke-width="2" opacity="0.5"/>

  <!-- Satellite nodes -->
  <circle cx="140" cy="160" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="380" cy="170" r="16" fill="#e879f9" filter="url(#glow)"/>
  <circle cx="360" cy="350" r="12" fill="#34d399" filter="url(#glow)"/>
  <circle cx="150" cy="360" r="10" fill="#fb923c" filter="url(#glow)"/>
  <circle cx="256" cy="96" r="8" fill="#facc15" filter="url(#glow)"/>

  <!-- Center core halo & node -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="32" fill="#22d3ee" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
