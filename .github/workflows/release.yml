name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "NetScope Desktop v__VERSION__"
          releaseBody: |
            ### NetScope Desktop v__VERSION__
            Real-time, hardware-accelerated Windows network topology visualizer and process security monitor.

            #### Download & Install:
            - Download `NetScope_x64-setup.exe` or `NetScope_x64_en-US.msi` below and run the installer.

            #### What NetScope Includes:
            - **Real-Time Network Topology Map:** Hardware-accelerated (PixiJS WebGL) visual graph displaying all active network communication across your PC in real-time.
            - **Process-Level Socket Attribution:** Instantly maps every open TCP/UDP socket and remote IP directly to its local executable, PID, and process tree.
            - **Laptop Touchpad & Mouse Navigation:** Silky smooth pinch-to-zoom gestures, two-finger panning, discrete mouse wheel zooming, and on-screen zoom/center controls.
            - **Smart Threat Detection & Filtering:** Evaluates listening ports, data exfiltration bursts, cryptomining connections, and threat nodes without noise from Windows internal ephemeral RPC ports.
            - **Actionable Security Guidance:** Alerts provide plain-language instructions ("What to do"), one-click camera focus, and process termination controls.
            - **Local Service Correlation:** Automatically correlates client applications directly to local microservices and AI engines (e.g. Ollama, Neo4j, Redis, local development servers).
            - **LAN & Gateway Discovery:** Accurate routing table gateway detection and rate-limited ARP discovery with offline MAC OUI vendor lookups.
            - **Interactive Port & Socket Inspector:** Live searchable and sortable table of all open ports, protocols, listening processes, and socket connection states.
            - **Dynamic Legend & Quick Filters:** One-click protocol filtering (HTTPS, HTTP, DNS, SSH, UDP) with port pinning and one-click standard port restoration.
            - **Built-In Speed & Latency Test:** In-app real-time latency (ping), jitter, and bandwidth diagnostics.
            - **Host PC System Resource Telemetry:** Live monitor for CPU, RAM, GPU, Disk, and live network I/O throughput.
            - **One-Click Firewall Rule Creation:** Block suspicious external IPs directly through Windows Defender Firewall.
            - **Critical System Process Protection:** Guardrails prevent terminating vital Windows processes (`svchost.exe`, `System`, `lsass.exe`, `explorer.exe`).
            - **In-App Auto-Update Notification:** Detects new GitHub releases and prompts users to update seamlessly.
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
