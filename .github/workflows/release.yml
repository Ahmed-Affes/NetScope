name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "NetScope Desktop v__VERSION__"
          releaseBody: |
            ### NetScope Desktop Release

            Hardware-accelerated Windows network topology visualizer.

            #### Download & Install:
            - Download the `.exe` installer below and run it.

            #### What's included:
            - Native Win32 TCP/UDP socket telemetry (processes, ports, states, PIDs)
            - Local traffic correlation (client apps linked directly to local services like Ollama and Neo4j)
            - Routing table gateway resolution (no `.1` heuristics)
            - Rate-limited LAN discovery via Win32 `SendARP` and offline MAC OUI vendor lookup
            - Overview vs All views with remote endpoint clustering
            - Dynamic traffic legend with live connection counts and port pinning
            - Plain-language process inspector with system process protection guardrails
            - One-click endpoint firewall blocking via Windows Firewall
            - Optional UAC elevation for kernel ETW per-connection bandwidth metering
            - Hardened security with strict Content Security Policy and validated inputs

            #### Code Signing:
            - For instructions on verifying Authenticode signatures and configuring production certificates, see `docs/CODE_SIGNING.md`.
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
