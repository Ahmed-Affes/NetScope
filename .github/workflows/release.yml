name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm install

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "NetScope Desktop v__VERSION__"
          releaseBody: |
            ### NetScope Desktop Release

            Real-time Windows network topology visualizer & cyber threat monitor.

            #### Download & Install:
            - Download the `.exe` installer below and run it.

            #### What's included:
            - Live PC socket table reader (processes, IPs, ports)
            - ARP cache scanner (LAN gateway & device discovery)
            - 60 FPS WebGL force-directed network graph (PixiJS v8)
            - Real-time threat detection (SSH brute-force, C2 beacons, port scans)
            - Session recording & replay with node drag positions
            - ATK-SIM panel with 7 built-in cyber attack simulations
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
