name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Frontend
        run: pnpm build

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NetScope Desktop ${{ github.ref_name }}"
          releaseBody: |
            ### NetScope Desktop Release 🛰️
            
            Autonomous Network Intelligence & Cyber Threat Visualizer.
            
            #### 📦 Download & Install:
            - Download the Windows installer (`.exe` or `.msi`) below.
            - Run the setup file to install NetScope on your PC.
            
            #### ✨ Key Features:
            - **60 FPS WebGL Topology**: PixiJS v8 force-directed network graph.
            - **Process Attribution**: Maps connections to local executables (`PID`) and containers.
            - **Real-Time Threat Engine**: Cobalt Strike C2 beacon detection, port scans, and exfiltration alerts.
            - **ATK-SIM**: 7 built-in cyber attack vectors for live demonstrations.
            - **Zero-Local-DB**: RAM-only execution and encrypted cloud sync.
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Setup
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
