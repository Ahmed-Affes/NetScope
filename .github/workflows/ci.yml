name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript Check
        run: pnpm typecheck

      - name: Run Vitest Tests
        run: pnpm test

      - name: Build Frontend Bundle
        run: pnpm build

  backend:
    name: Rust Backend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpcap-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Rustfmt Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build-desktop:
    name: Build Windows Desktop App (.exe)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Frontend
        run: pnpm build

      - name: Build Tauri Desktop Bundle
        run: pnpm tauri build

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Desktop-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: "NetScope Desktop v0.2.0"
          body: |
            ### NetScope Desktop v0.2.0 - 100% Native Windows Desktop Release
            - **100% Real-Time Live PC Topology**: Real Windows socket poller (TCP & UDP) mapped to your actual PC and processes.
            - **Real PC ATK-SIM**: Cyber threat simulations anchored directly to your machine's hostname and running apps.
            - **Full Network Incident Replay**: Scrubbable timeline with playback speeds (0.5x, 1x, 2x, 4x), session recording, and incident traces.
            - **Frameless Window Management**: Tauri v2 custom titlebar with minimize, maximize, and close controls.
            - **HUD Layout & Collision Optimization**: Zero panel overlap between metrics, ATK-SIM, alerts, and legend.
            - **In-App Update System**: Live GitHub release notifications and direct installer download.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
