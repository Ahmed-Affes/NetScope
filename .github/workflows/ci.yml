name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript Check
        run: pnpm typecheck

      - name: Run Vitest Tests
        run: pnpm test

      - name: Build Frontend Bundle
        run: pnpm build

  backend:
    name: Rust Backend Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Rustfmt Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-desktop:
    name: Build Windows Desktop App (.exe)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Frontend
        run: pnpm build

      - name: Build Tauri Desktop Bundle
        run: pnpm tauri build

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-Desktop-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.6
          name: "NetScope Desktop v0.2.6"
          body: |
            ### NetScope Desktop v0.2.6 - Native Windows Network Topology
            - **Native Win32 Socket Telemetry**: Real Windows TCP & UDP socket polling mapped to active processes and listening services.
            - **Local Traffic Correlation**: Client applications linked directly to local services (e.g. Ollama, Neo4j, Vite).
            - **Accurate Gateway Resolution**: Discovered directly from the Windows routing table (no `.1` heuristics).
            - **Subnet LAN Discovery**: Light SendARP scanning with bundled offline MAC OUI vendor resolution.
            - **Clean Overview Mode**: Groups remote CDN/cloud endpoints into expandable organization clusters.
            - **Customizable Traffic Legend**: Live connection counts, pinned ports, and dimmed zero-activity rows.
            - **Guarded Process Inspector**: Plain-language process overview with critical system process termination protection.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
